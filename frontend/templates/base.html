{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}THE SAFEST BANK{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%239D174D' d='M16 2l11 4v9c0 7.5-4.9 12.7-11 15-6.1-2.3-11-7.5-11-15V6l11-4z'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-weight='800' font-size='15' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{% static 'portal/css/base.css' %}">
{% block extra_css %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <script>
    window.FASTAPI_BASE_URL = "{{ FASTAPI_BASE_URL|default:'http://127.0.0.1:8001' }}";
    window.PORTAL_USER_ID = "{{ PORTAL_USER_ID|default:'usr_1001' }}";
    window.PORTAL_USER_NAME = "{{ PORTAL_USER_NAME|default:'Aarav Sharma' }}";
  </script>
  <script src="{% static 'portal/js/services/config.js' %}"></script>
  <script src="{% static 'portal/js/services/fraudService.js' %}"></script>
  <script src="{% static 'portal/js/services/transactionService.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
